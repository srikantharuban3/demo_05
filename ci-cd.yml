name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
        
    - name: Run tests
      run: npm test

    - name: Generate test report
      if: always()
      run: |
        echo "# Test Report" > test-report.md
        echo "Tests completed at: $(date)" >> test-report.md
        echo "Repository: ${{ github.repository }}" >> test-report.md
        echo "Branch: ${{ github.ref_name }}" >> test-report.md
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-report.html
          coverage/
          test-report.md